name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check-version:
    name: Check version matches tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi
      # beamup --version reads Cargo.toml, not the tag. Fail early rather than
      # publish a binary that reports the wrong version (as v0.1.1 did).
      - name: Verify Cargo.toml version
        run: bash scripts/check-version.sh "${{ steps.tag.outputs.version }}"

  build-agent:
    name: Build agent (${{ matrix.arch }}-linux-musl)
    needs: check-version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Beams come in both architectures; the CLI embeds one agent for each
        # and selects at deploy time from `uname -m` on the beam.
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-musl
          - arch: aarch64
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross
      - name: Build agent
        run: cross build --release --target ${{ matrix.target }} -p beamup-agent
      - name: Upload agent artifact
        uses: actions/upload-artifact@v7
        with:
          name: agent-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/beamup-agent

  build-cli:
    name: Build CLI (${{ matrix.name }})
    needs: build-agent
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - name: darwin-arm64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: darwin-amd64
            os: macos-latest
            target: x86_64-apple-darwin
          - name: linux-arm64
            os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            use-cross: true
          - name: linux-amd64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            use-cross: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Download agent artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: agent-*
          path: agent-bin
      - name: Install cross
        if: matrix.use-cross
        run: cargo install cross --git https://github.com/cross-rs/cross
      # Put the agents where build.rs already looks, rather than pointing env
      # vars at them: cross runs build.rs inside a container, where host paths
      # and un-passed-through env vars would not resolve.
      - name: Stage agents into target/
        run: |
          for arch in x86_64 aarch64; do
            dir="target/${arch}-unknown-linux-musl/release"
            mkdir -p "$dir"
            cp "agent-bin/agent-${arch}/beamup-agent" "$dir/beamup-agent"
            chmod +x "$dir/beamup-agent"
          done
      - name: Build CLI
        run: |
          if [ "${{ matrix.use-cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} -p beamup-cli
          else
            cargo build --release --target ${{ matrix.target }} -p beamup-cli
          fi
      - name: Rename binary
        run: |
          cp target/${{ matrix.target }}/release/beamup beamup-${{ matrix.name }}
      - name: Upload CLI artifact
        uses: actions/upload-artifact@v7
        with:
          name: beamup-${{ matrix.name }}
          path: beamup-${{ matrix.name }}

  release:
    name: Create release
    needs: [check-version, build-cli]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      # Only the CLI binaries are release assets; the agent artifacts are an
      # internal build input and are excluded here.
      - name: Download CLI artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: beamup-*
          merge-multiple: true
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ needs.check-version.outputs.version }}
          name: ${{ needs.check-version.outputs.version }}
          generate_release_notes: true
          files: artifacts/beamup-*
